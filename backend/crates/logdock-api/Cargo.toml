[package]
name = "logdock-api"
description = "HTTP API of Logdock: ingest endpoints, the web interface's API and its static files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Primary adapter: calls the contexts' use cases, never secondary adapters
# (no dependency on logdock-infra). See docs/architecture.md, 9.
[dependencies]
logdock-identity.workspace = true
logdock-kernel.workspace = true
logdock-projects.workspace = true
logdock-retention.workspace = true
axum.workspace = true
axum-extra.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
logdock-identity = { workspace = true, features = ["testing"] }
logdock-projects = { workspace = true, features = ["testing"] }
async-trait.workspace = true
http-body-util.workspace = true
tempfile.workspace = true

[lints]
workspace = true
