[package]
name = "logdock-issues"
description = "Bounded context Issues: error events, their grouping into issues, the issues' states and notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Core crate of a bounded context: no I/O, no frameworks. Adapters live in
# logdock-infra and logdock-api. See docs/architecture.md, 9.
[dependencies]
logdock-kernel.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# The lock that serializes grouping.
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true

[features]
# In-memory implementations of all ports, for tests.
testing = []

[lints]
workspace = true
