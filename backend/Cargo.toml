[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates. Which crate may depend on which is documented in
# docs/architecture.md, section 9, and checked by logdock-architecture.
logdock-api = { path = "crates/logdock-api" }
logdock-identity = { path = "crates/logdock-identity" }
logdock-infra = { path = "crates/logdock-infra" }
logdock-kernel = { path = "crates/logdock-kernel" }
logdock-logs = { path = "crates/logdock-logs" }
logdock-projects = { path = "crates/logdock-projects" }
logdock-retention = { path = "crates/logdock-retention" }
logdock-sentry = { path = "crates/logdock-sentry" }

anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
getrandom = "0.4"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# SQLite is bundled, so every build runs against the same, known version
# (libsqlite3-sys compiles it with FTS5).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
# Free space of the data directory (statvfs).
rustix = { version = "1.1", features = ["fs"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "request-id", "util", "fs", "set-header", "limit", "decompression-gzip", "decompression-deflate", "decompression-br", "decompression-zstd"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "6"
utoipa-axum = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
