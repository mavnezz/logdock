# Logdock with a Laravel app that sends to it: for trying both together and
# for the end-to-end check, `just e2e` (docs/testing.md). Not for a server:
# fixed setup code and app key, plain HTTP, everything on localhost.
#
#   Logdock    http://localhost:18480   (setup code dev-setup-code)
#   Laravel    http://localhost:18400   (/scenario/log, /fail, /handled, /job)
#   Mailpit    http://localhost:18425   (the e-mail Logdock sends)
#   Nginx      http://localhost:18401   (in front of Laravel)
#
# The Laravel containers send to `capture`, which keeps a copy of what the
# SDK sent in dev/captured/ and passes it on to Logdock. Their DSN comes from
# LARAVEL_DSN, which dev/e2e/run.mjs creates. The forwarders (docs/forwarders.md)
# get keys of their own: Vector reads Nginx's output and Laravel's JSON log
# file, Fluent Bit gets the worker's output through Docker's fluentd driver.
name: logdock-dev

x-laravel: &laravel
  build: dev/laravel
  image: logdock-dev-laravel
  restart: unless-stopped
  volumes:
    - laravel-data:/data
  environment: &laravel-env
    APP_NAME: orders-test
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: base64:juRKiTB/UWHBi0JhH4kNmky1fHXdaegm6zJR1ZOvIDM=
    APP_URL: http://localhost:18400
    QUEUE_CONNECTION: database
    CACHE_STORE: file
    SESSION_DRIVER: file
    LOG_CHANNEL: stack
    LOG_STACK: stderr,sentry_logs
    LOG_LEVEL: debug
    SENTRY_LARAVEL_DSN: ${LARAVEL_DSN:-}
    SENTRY_ENVIRONMENT: production
    SENTRY_RELEASE: ${LARAVEL_RELEASE:-dev-1}
    SENTRY_SEND_DEFAULT_PII: "false"
    SENTRY_ENABLE_LOGS: "true"
    SENTRY_LOG_LEVEL: info
    # The `json` channel's files, for the forwarders' buffered mode.
    LOG_JSON_PATH: /data/logs/laravel.json
    # Monitoring: every request and job as a transaction, every scheduled
    # task as a monitor.
    SENTRY_TRACES_SAMPLE_RATE: ${LARAVEL_TRACES_SAMPLE_RATE:-1.0}
    SENTRY_CRONS_MONITOR_SCHEDULED_TASKS: "true"
    LOG_SERVER: dev-host

services:
  logdock:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: logdock:dev
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      LOGDOCK_PUBLIC_URL: http://localhost:18480
      LOGDOCK_SECURE_COOKIES: "false"
      LOGDOCK_SETUP_CODE: dev-setup-code
      LOGDOCK_SMTP_URL: smtp://mailpit:1025
      LOGDOCK_MAIL_FROM: Logdock <logdock@logdock.test>
      LOGDOCK_LOG_FORMAT: text
      LOGDOCK_MIN_FREE_DISK: 100MiB
    ports:
      - "127.0.0.1:18480:8080"
    volumes:
      - ./dev/data/logdock:/data

  capture:
    image: node:24-alpine
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["node", "/e2e/capture.mjs"]
    environment:
      UPSTREAM: http://logdock:8080
      OUT: /captured
    volumes:
      - ./dev/e2e:/e2e:ro
      - ./dev/captured:/captured

  mailpit:
    image: axllent/mailpit:v1.32
    restart: unless-stopped
    ports:
      - "127.0.0.1:18425:8025"

  migrate:
    <<: *laravel
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]

  web:
    <<: *laravel
    environment:
      <<: *laravel-env
      LOG_SERVICE: web
    ports:
      - "127.0.0.1:18400:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=1"]
    environment:
      <<: *laravel-env
      LOG_SERVICE: horizon
      # Its own output only (queue:work's lines), through Fluent Bit; its log
      # entries go through the SDK.
      LOG_STACK: sentry_logs
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:18424
        fluentd-async: "true"
        tag: docker.{{.Name}}
        labels: com.docker.compose.service
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      LOG_SERVICE: scheduler
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:1.31.9-alpine
    restart: unless-stopped
    labels:
      logdock.forward: "true"
    volumes:
      - ./dev/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:18401:80"
    depends_on:
      - web

  vector:
    image: timberio/vector:0.62.0-alpine
    restart: unless-stopped
    environment:
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      LOGDOCK_URL: http://logdock:8080
      LOGDOCK_KEY: ${LOGDOCK_VECTOR_KEY:-}
      LOGDOCK_STACK: logdock-dev
      LOGDOCK_HOST: dev-host
      LARAVEL_LOGS: /laravel/logs
    volumes:
      - ./forwarders/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - laravel-data:/laravel:ro
      - vector-data:/var/lib/vector

  fluent-bit:
    image: fluent/fluent-bit:5.2.0
    restart: unless-stopped
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/config/fluent-bit.yaml"]
    environment:
      LOGDOCK_HOST_NAME: logdock
      LOGDOCK_PORT: "8080"
      LOGDOCK_TLS: "off"
      LOGDOCK_KEY: ${LOGDOCK_FLUENT_KEY:-}
      LOGDOCK_HOST: dev-host
    ports:
      - "127.0.0.1:18424:24224"
    volumes:
      - ./forwarders/fluent-bit/fluent-bit.yaml:/config/fluent-bit.yaml:ro
      - fluent-bit-data:/var/lib/fluent-bit

volumes:
  laravel-data:
  vector-data:
  fluent-bit-data:
