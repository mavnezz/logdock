# Runs exactly what `just check` runs locally, with Rust as
# rust-toolchain.toml pins it, Node as .nvmrc pins it and the other tools as
# scripts/install-tools.sh pins them, and builds the Docker image. Actions
# are pinned to commit SHAs; tags can be moved, commits cannot.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain and its components as rust-toolchain.toml names them.
      - name: Rust
        run: rustup toolchain install && cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # just, cargo-deny and cargo-llvm-cov in fixed versions.
      - name: Tools
        run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Frontend dependencies
        run: just web-install

      - name: just check
        run: just check

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('dev/coverage/backend.json') != '' }}
        run: |
          {
            echo '### Coverage'
            echo '```text'
            scripts/coverage-check.sh dev/coverage/backend.json 2>&1 || true
            if [[ -f dev/coverage/frontend/coverage-summary.json ]]; then
              jq -r '"frontend lines \(.total.lines.pct) %, statements \(.total.statements.pct) %"' dev/coverage/frontend/coverage-summary.json
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f docker/Dockerfile --build-arg LOGDOCK_VERSION="${GITHUB_SHA::12}" -t logdock:ci .

      # The image starts, answers its health check and stops on SIGTERM.
      - name: Smoke test
        run: |
          mkdir -p data && sudo chown 65532:65532 data
          docker run -d --name logdock -v "$PWD/data:/data" -e LOGDOCK_PUBLIC_URL=http://localhost:8080 \
            -e LOGDOCK_MIN_FREE_DISK=100MB -p 8080:8080 logdock:ci
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          docker stop --time 30 logdock
          test "$(docker inspect -f '{{.State.ExitCode}}' logdock)" = 0
