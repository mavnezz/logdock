# Runs exactly what `just check` runs locally, with Rust as
# rust-toolchain.toml pins it, Node as .nvmrc pins it and the other tools as
# scripts/install-tools.sh pins them, builds the Docker image and, once all
# of it passed, publishes the image to ghcr.io. Actions are pinned to commit
# SHAs; tags can be moved, commits cannot.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain and its components as rust-toolchain.toml names them.
      - name: Rust
        run: rustup toolchain install && cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: backend

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # just, cargo-deny and cargo-llvm-cov in fixed versions.
      - name: Tools
        run: |
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Frontend dependencies
        run: just web-install

      - name: just check
        run: just check

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('dev/coverage/backend.json') != '' }}
        run: |
          {
            echo '### Coverage'
            echo '```text'
            scripts/coverage-check.sh dev/coverage/backend.json 2>&1 || true
            if [[ -f dev/coverage/frontend/coverage-summary.json ]]; then
              jq -r '"frontend lines \(.total.lines.pct) %, statements \(.total.statements.pct) %"' dev/coverage/frontend/coverage-summary.json
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version the binary reports: a tag's (v1.2.3 gives 1.2.3), else
      # the commit's. The publish job builds with the same, from this cache.
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: LOGDOCK_VERSION=${{ steps.version.outputs.version }}
          tags: logdock:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image starts, answers its health check and stops on SIGTERM.
      - name: Smoke test
        run: |
          mkdir -p data && sudo chown 65532:65532 data
          docker run -d --name logdock -v "$PWD/data:/data" -e LOGDOCK_PUBLIC_URL=http://localhost:8080 \
            -e LOGDOCK_MIN_FREE_DISK=100MB -p 8080:8080 logdock:ci
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          docker stop --time 30 logdock
          test "$(docker inspect -f '{{.State.ExitCode}}' logdock)" = 0

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Logdock and the Laravel test app in Docker (compose.dev.yaml); see
      # docs/testing.md.
      - name: just e2e
        run: node dev/e2e/run.mjs

      - name: Captured envelopes
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captured
          path: dev/captured/

  # Publishes the image to ghcr.io/<owner>/<repo> when everything above
  # passed: `latest` and `sha-<commit>` from main, `1.2.3` and `1.2` from a
  # tag `v1.2.3`. Pull requests only build it. compose.ghcr.yaml pulls it.
  publish:
    name: Publish image
    if: ${{ github.event_name == 'push' }}
    needs: [check, image, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: LOGDOCK_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
